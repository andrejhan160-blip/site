<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search);
var w=+(q.get('w')||390), src=q.get('src')||'/nedvizhimost/';
var f=document.getElementById('f'); f.style.width=w+'px'; f.style.height='3000px'; f.src=src;
setTimeout(function(){
  var d=f.contentDocument, W=d.defaultView, out=[];
  var links=[].filter.call(d.querySelectorAll('a[href]'),function(a){
    return /telegra\.ph|graph\.org|youtu/.test(a.getAttribute('href'));});
  links.slice(0,6).forEach(function(a){
    var r=a.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+Math.min(r.height/2,40);
    var hit=d.elementFromPoint(cx,cy);
    var covered = hit && !a.contains(hit) && hit!==a;
    var s=W.getComputedStyle(a);
    out.push({host:a.getAttribute('href').split('/')[2],
      target:a.getAttribute('target'), rel:a.getAttribute('rel'),
      pe:s.pointerEvents, w:Math.round(r.width), h:Math.round(r.height),
      covered:covered, hitTag:hit?hit.tagName+'.'+String(hit.className||'').slice(0,20):'нет'});
  });
  var hosts={};
  [].forEach.call(d.querySelectorAll('a[href^="http"]'),function(a){
    var h=a.getAttribute('href').split('/')[2]; hosts[h]=(hosts[h]||0)+1;});
  document.documentElement.setAttribute('data-tap',JSON.stringify({total:links.length,hosts:hosts,sample:out}));
},9000);
</script></body></html>
