<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search);
var w=+(q.get('w')||390), src=q.get('src')||'/nedvizhimost/';
var f=document.getElementById('f'); f.style.width=w+'px'; f.style.height='800px'; f.src=src;
setTimeout(function(){
  var d=f.contentDocument, out=[], clicked=[];
  var links=[].filter.call(d.querySelectorAll('a[href]'),function(a){
    return /telegra\.ph/.test(a.getAttribute('href'));});
  links.slice(0,5).forEach(function(a,i){
    a.scrollIntoView({block:'center'});
    var r=a.getBoundingClientRect();
    var hit=d.elementFromPoint(r.left+r.width/2, r.top+r.height/2);
    out.push({i:i, ok: !!(hit && (a===hit || a.contains(hit))),
      hit: hit?hit.tagName+'.'+String(hit.className||'').slice(0,18):'null'});
    // реальный клик: перехватываем переход
    var got=null;
    a.addEventListener('click',function(e){got=e.defaultPrevented?'ОТМЕНЁН':'проходит';e.preventDefault();},true);
    a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    clicked.push(got||'обработчик не сработал');
  });
  document.documentElement.setAttribute('data-tap',JSON.stringify({hit:out,click:clicked}));
},9000);
</script></body></html>
